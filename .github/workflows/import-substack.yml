# Every morning: bring in new Substack posts and make their share images.
# Runs on its own; to run it right away, open the repo on GitHub,
# go to Actions → "Import from Substack" → "Run workflow".
name: Import from Substack

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC, daily
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdownify beautifulsoup4 pillow
      - run: python3 tools/import-substack.py
      - run: python3 tools/make-share-images.py
      - name: Publish new posts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A _posts assets
          if git diff --cached --quiet; then echo "Nothing new on Substack."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import new posts from Substack"
          git push
          # Pushes made by this job don't start a site build by themselves
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
