# Where the Subscribe buttons go.
subscribe_url: https://actualspirit.substack.com/subscribe

# "Start here": essays for new readers. Use the slug from the article's address
# (dialectmaterial.github.io/articles/<slug>/). The blurb is optional;
# without one, the opening lines of the essay are shown.
start_here:
  intro: New here? Three essays to begin with.
  essays:
    - slug: everyone-knows-perfection-is-absurd
      blurb: Spinoza, Descartes and why reality is the perfect absurdity.
    - slug: communisation-in-absolute-capitalism
      blurb: On communism and capital.
    - slug: slovenian-school-reading-group
      blurb: On dialectical materialism.

