# The About block at the bottom of the home page.
about: |
  Dimitri F. Crooijmans writes *Actual Spirit*, a journal of speculative philosophy
  at the crossing of German Idealism, Lacanian psychoanalysis and theology. He has led the
  Slovenian School Reading Group at Philosophy Portal, makes music as Objet lil a,
  and talks philosophy on YouTube. His new book is *Rosy Cross*.

# A one-line bio shown at the end of every article.
signoff: |
  **Dimitri F. Crooijmans** writes on Hegel, Lacan and theology. New essays arrive by email
  on Substack.
