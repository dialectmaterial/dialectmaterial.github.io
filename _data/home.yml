# Everything on the home page lives in this file. Edit freely.
# Text in "|" blocks is Markdown: *italic*, **bold**, [link](https://...).

# The big opening at the top of the page.
hero:
  kicker: Actual Spirit
  # Each line becomes its own line in the big heading.
  heading:
    - Express art.
    - Explore religion.
    - Explicate philosophy.
  intro: |
    Hi, I'm Dimitri. I write about Hegel, Lacan and the Slovenian School,
    and what they have to say about the self, God, enjoyment and politics today.
    Along the way there are stories, songs and conversations. Everything here is free to read.

