# Everything on the home page lives in this file. Edit freely.
# Text in "|" blocks is Markdown: *italic*, **bold**, [link](https://...).

welcome:
  heading: Express Art. Explore Religion. Explicate Philosophy.
  text: |
    Hi, I'm Dimitri. I write about Hegel, Lacan and the Slovenian School,
    and what they have to say about the self, God, enjoyment and politics today.
    Along the way there are stories, songs and conversations.

    Everything I've written is here, free to read. Pull up a chair.
  # The button under the welcome text.
  button_label: Get new essays by email
  button_url: https://actualspirit.substack.com/subscribe

# "Start here": essays shown as cards. Use the slug from the article's address
# (dialectmaterial.github.io/articles/<slug>/). The blurb is optional;
# without one, the article's subtitle is shown.
start_here:
  - slug: everyone-knows-perfection-is-absurd
    blurb: Spinoza, Descartes and why perfection is both impossible and necessary.
  - slug: communisation-in-absolute-capitalism
    blurb: From Dawkins, Harris and Peterson to Christian Atheism, and real speculation against bad.
  - slug: the-i-as-a-funny-circle
    blurb: Hegel's concept, the "I", and why Kant couldn't keep up with its funny movement.

