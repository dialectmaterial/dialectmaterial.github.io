# The /insta/ page: everything that was on Instagram, kept here.
# This file is edited by hand. The posts themselves are in _data/insta_posts.json,
# written by tools/import-instagram.py from the Instagram export.

profile:
  username: objetlila
  name: Dimitri F. Crooijmans
  avatar: /assets/profile.jpg
  # Line breaks are kept, as on Instagram.
  bio: |
    I left Instagram.
    Everything I posted there lives on here,
    and new work goes to the site and Substack.
  link:
    label: actualspirit.com
    url: /

# A short notice above the grid. Leave empty to hide it.
notice:

# The two buttons beside the username (where Follow and Message would be).
buttons:
  - label: Subscribe
    url: https://actualspirit.substack.com/subscribe
    primary: true

# The round "highlights" under the bio, as links to the rest of the site. Empty: hidden.
highlights: []
